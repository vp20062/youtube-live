name: 6-Hour Auto Stream Loop

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Execute Stream
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          if [ -z "$STREAM_KEY" ]; then
            echo "Error: STREAM_KEY is empty. Check your GitHub Secrets."
            exit 1
          fi

          ffmpeg -re -loop 1 -i xyz.png -stream_loop -1 -i audio.m4a -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2" -c:v libx264 -preset ultrafast -tune stillimage -b:v 2500k -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p -r 30 -g 60 -c:a aac -b:a 128k -ar 44100 -map 0:v:0 -map 1:a:0 -shortest -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"

      - name: Trigger Next Run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run live.yml --repo ${{ github.repository }}
