name: 6-Hour Auto Stream Loop (Single Channel Safe)

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        channel:
          - id: "ch2"
            name: "Channel 2"
            image_file: "channel_2.png"
            audio_file: "audio_ch2.m4a"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Convert Audio to Stable MP3 Format
        run: |
          echo "Converting audio to MP3..."
          ffmpeg -i "${{ matrix.channel.audio_file }}" -vn -codec:a libmp3lame -b:a 128k stream_audio.mp3 -y

      - name: Execute Stream for ${{ matrix.channel.name }}
        env:
          RAW_KEY: ${{ secrets.STREAM_KEY_2 }}
        run: |
          # Stream key ko sanitize karein
          STREAM_KEY=$(echo -n "$RAW_KEY" | tr -d '\r\n[:space:]"')

          if [ -z "$STREAM_KEY" ]; then
            echo "::error::Stream key missing hai!"
            exit 1
          fi

          echo "Starting Stream Pipeline with Steady Frame Rate..."

          ffmpeg -re \
            -loop 1 -framerate 30 -i "${{ matrix.channel.image_file }}" \
            -stream_loop -1 -i stream_audio.mp3 \
            -map 0:v:0 -map 1:a:0 \
            -t 19800 \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
            -r 30 -fps_mode cfr \
            -c:v libx264 -preset ultrafast -tune stillimage -threads 1 \
            -b:v 1000k -maxrate 1000k -bufsize 2000k \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 96k -ar 44100 -ac 2 \
            -max_muxing_queue_size 9999 \
            -flvflags no_duration_filesize \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"

      - name: Wait for YouTube Connection Release
        run: sleep 20

  trigger-next-loop:
    needs: run-stream
    if: always() && !cancelled() && needs.run-stream.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Next Run
        env:
          GH_TOKEN: ${{ secrets.AUTO_STREAM_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AUTO_STREAM_PAT Secret missing hai!"
            exit 1
          fi

          sleep 20
          gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
