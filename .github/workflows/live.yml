name: 6-Hour Auto Stream Loop

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Stream
        run: |
          timeout 350m ffmpeg -re -stream_loop -1 -i audio.mp3 -loop 1 -framerate 30 -i xyz.png -c:v libx264 -preset ultrafast -tune stillimage -b:v 2500k -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p -r 30 -g 60 -c:a aac -b:a 128k -ar 44100 -shortest -f flv "rtmp://a.rtmp.youtube.com/live2/YOUR_STREAM_KEY" || true

      - name: Trigger Next Run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run stream.yml --repo ${{ github.repository }}
