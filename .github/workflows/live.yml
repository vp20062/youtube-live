name: 5-Hour Auto Stream Loop (Single Channel)

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        channel:
          - id: "ch2"
            name: "Channel 2"
            image_file: "channel_2.png"
            audio_file: "audio_ch2.m4a"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure FFmpeg is Installed
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            echo "FFmpeg not found. Installing..."
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          else
            echo "FFmpeg is already installed: $(ffmpeg -version | head -n 1)"
          fi

      - name: Check Input Files
        run: |
          echo "Verifying input files exist..."
          if [ ! -f "${{ matrix.channel.image_file }}" ]; then
            echo "::error::Image file '${{ matrix.channel.image_file }}' not found in repo root!"
            exit 1
          fi

          if [ ! -f "${{ matrix.channel.audio_file }}" ]; then
            echo "::error::Audio file '${{ matrix.channel.audio_file }}' not found in repo root!"
            exit 1
          fi

          ls -lh "${{ matrix.channel.image_file }}" "${{ matrix.channel.audio_file }}"

      - name: Execute Stream for ${{ matrix.channel.name }}
        env:
          RAW_KEY: ${{ secrets.STREAM_KEY_2 }}
        run: |
          STREAM_KEY=$(echo -n "$RAW_KEY" | tr -d '\r\n[:space:]"')

          if [ -z "$STREAM_KEY" ]; then
            echo "::error::STREAM_KEY_2 secret is missing or empty!"
            exit 1
          fi

          echo "Starting 5-Hour Fixed Stream Pipeline..."

          ffmpeg -hide_banner -loglevel warning \
            -loop 1 -framerate 30 -re -i "${{ matrix.channel.image_file }}" \
            -stream_loop -1 -re -i "${{ matrix.channel.audio_file }}" \
            -map 0:v:0 -map 1:a:0 \
            -t 18000 \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
            -r 30 -fps_mode cfr \
            -c:v libx264 -preset ultrafast -tune stillimage \
            -b:v 2500k -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 160k -ar 44100 -ac 2 \
            -max_muxing_queue_size 2048 \
            -flvflags no_duration_filesize \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"

      - name: Wait for YouTube Connection Release
        run: sleep 15

  trigger-next-loop:
    needs: run-stream
    if: always() && !cancelled() && needs.run-stream.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Trigger Next Run
        env:
          GH_TOKEN: ${{ secrets.AUTO_STREAM_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AUTO_STREAM_PAT secret is missing!"
            exit 1
          fi

          echo "Stream completed. Triggering next cycle..."
          sleep 10
          gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
