name: 6-Hour Auto Stream Loop (Parallel Matrix)

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        channel:
          - id: "ch1"
            name: "Channel 1"
            image_file: "xyz.png"
            audio_file: "audio_ch1.m4a"
          - id: "ch2"
            name: "Channel 2"
            image_file: "channel_2.png"
            audio_file: "audio_ch2.m4a"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Media Files
        run: |
          if [ ! -f "${{ matrix.channel.image_file }}" ]; then
            echo "::error::${{ matrix.channel.image_file }} file nahi mili!"
            exit 1
          fi
          if [ ! -f "${{ matrix.channel.audio_file }}" ]; then
            echo "::error::${{ matrix.channel.audio_file }} file nahi mili!"
            exit 1
          fi
          echo "Files verified for ${{ matrix.channel.name }}"

      - name: Execute Stream for ${{ matrix.channel.name }}
        env:
          STREAM_KEY: ${{ matrix.channel.id == 'ch1' && secrets.STREAM_KEY || secrets.STREAM_KEY_2 }}
        run: |
          if [ -z "$STREAM_KEY" ]; then
            echo "::error::Stream key missing hai for ${{ matrix.channel.name }}!"
            exit 1
          fi

          # 5 Hours 30 Minutes duration (19800 seconds)
          ffmpeg -loglevel warning -re \
            -loop 1 -framerate 2 -i "${{ matrix.channel.image_file }}" \
            -stream_loop -1 -i "${{ matrix.channel.audio_file }}" \
            -t 19800 \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
            -c:v libx264 -preset ultrafast -tune stillimage -b:v 1500k -maxrate 1500k -bufsize 3000k \
            -r 30 -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"

      - name: Wait for YouTube Connection Release
        run: sleep 30

  trigger-next-loop:
    needs: run-stream
    if: "!cancelled()"
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Next Run
        env:
          GH_TOKEN: ${{ secrets.AUTO_STREAM_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AUTO_STREAM_PAT Secret missing hai!"
            exit 1
          fi

          sleep 30

          gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
