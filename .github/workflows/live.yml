name: 6-Hour Auto Stream Loop

on:
  workflow_dispatch:

concurrency:
  group: live-stream-loop
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Verify Files & Stream Key
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          if [ -z "$STREAM_KEY" ]; then
            echo "::error::STREAM_KEY missing in Secrets!"
            exit 1
          fi
          if [ ! -f "xyz.png" ]; then
            echo "::error::xyz.png nahi mili!"
            ls -la
            exit 1
          fi
          if [ ! -f "audio.m4a" ]; then
            echo "::error::audio.m4a nahi mili!"
            ls -la
            exit 1
          fi
          echo "All checks passed."

      - name: Execute Stream
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          # 5 Hours 30 Minutes duration (19800 seconds)
          ffmpeg -loglevel warning -re \
            -stream_loop -1 -i audio.m4a \
            -loop 1 -framerate 30 -i xyz.png \
            -t 19800 \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
            -c:v libx264 -preset veryfast -b:v 3000k -minrate 3000k -maxrate 3000k -bufsize 6000k \
            -r 30 -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 44100 \
            -map 1:v:0 -map 0:a:0 \
            -f flv -flvflags no_duration_filesize "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"

      - name: Wait for YouTube Disconnect
        run: sleep 15

      - name: Trigger Next Run
        env:
          GH_TOKEN: ${{ secrets.AUTO_STREAM_PAT }}
        run: |
          gh workflow run live.yml --repo "${{ github.repository }}"
