name: 6-Hour Auto Stream Loop

on:
  workflow_dispatch:

concurrency:
  group: live-stream-loop
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Stream (With Auto-Reconnect & Fail-Safe)
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          if [ -z "$STREAM_KEY" ]; then
            echo "Error: STREAM_KEY is empty. Check your GitHub Secrets."
            exit 1
          fi

          # Stream start time record karein
          START_TIME=$(date +%s)
          MAX_DURATION=19800 # 5 Hours 30 Minutes (in seconds)

          # Auto-restart loop agar FFmpeg network issue se crash ho
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((MAX_DURATION - ELAPSED))

            # Agar 5.5 hours complete ho gaye to loop exit karein
            if [ $REMAINING -le 60 ]; then
              echo "Stream target duration reached."
              break
            fi

            echo "Starting/Resuming stream. Remaining time: ${REMAINING}s"

            timeout "${REMAINING}s" ffmpeg -re \
              -stream_loop -1 -i audio.m4a \
              -loop 1 -framerate 30 -i xyz.png \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2" \
              -c:v libx264 -preset ultrafast -tune stillimage \
              -b:v 2500k -maxrate 2500k -bufsize 5000k \
              -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 44100 -async 1 \
              -map 1:v:0 -map 0:a:0 \
              -flvflags no_duration_filesize \
              -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY" || true

            echo "FFmpeg exited. Re-checking duration in 5 seconds..."
            sleep 5
          done

      - name: Wait for YouTube Disconnect
        run: sleep 15

      - name: Trigger Next Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run live.yml --repo ${{ github.repository }}
